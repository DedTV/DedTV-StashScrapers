name: Youjizz

sceneByName:
  action: scrapeXPath
  queryURL: https://www.youjizz.com/search/{}-1.html
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - youjizz.com
    scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    common:
      $videoCard: '//div[@id="min-list"]//div[contains(@class, "video")]'
    scene:
      Title: 
        selector: '$videoCard//span[@class="title"]/text()'
      URL: 
        selector: '$videoCard//a[1]/@href'
        postProcess:
          - replace:
              - regex: ^/
                with: https://www.youjizz.com/
      Image: 
        selector: '$videoCard//img/@data-original | $videoCard//img/@src'
      Duration:
        selector: '$videoCard//span[@class="length"]/text()'

  sceneScraper:
    scene:
      Title: 
        selector: '//h1/text() | //meta[@property="og:title"]/@content'
      Details: 
        selector: '//meta[@name="description"]/@content'
      Date:
        # Pulling from the script tags in your HTML
        selector: '//script[@type="application/ld+json" and contains(., "uploadDate")]/text()'
        postProcess:
          - replace:
              - regex: '(?s).*"uploadDate":\s*"([^"]+)".*'
                with: $1
          - parseDate: 2006-01-02
      Image: 
        selector: '//meta[@property="og:image"]/@content'
      URL: 
        selector: '//link[@rel="canonical"]/@href'
      Studio:
        Name:
          # Targets the uploader/channel link found in the details block
          selector: '//div[@id="video-details"]//a[contains(@href, "/channel/")]/text()'
          postProcess:
            - replace:
                - regex: '.+'
                  with: "TubeVideos"
      Tags:
        Name: '//div[@class="video-tags"]//a/text()'
      Performers:
        Name: '//div[contains(@class, "video-models")]//a/text()'

