name: Wankoz

sceneByName:
  action: scrapeXPath
  queryURL: https://www.wankoz.com/search/?q={}
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - wankoz.com
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: https://www.wankoz.com/videos/{filename}/
  queryURLReplace:
    filename:
      - regex: '.*\[(\d+)\].*'
        with: $1
      - regex: '^.*?(\d+)\..+$'
        with: $1
      - regex: .*\.[^\.]+$
        with:

xPathScrapers:
  sceneSearch:
    common:
      $videoCard: '//div[@class="thumbs-list"]//div[@class="thumb"]'
    scene:
      Title:
        selector: '$videoCard//span[@class="info-inner"]/a/b/text()'
      URL:
        selector: '$videoCard//span[@class="info-inner"]/a/@href'
      Image:
        selector: '$videoCard//span[@class="img"]/img/@data-original'

  sceneScraper:
    scene:
      Title:
        selector: '//div[@class="heading"]/h1/text()'
        postProcess:
          - replace:
              - regex: '\s+$'
                with: ""
      Tags:
        Name:
          selector: '//div[@class="video-tags"]/a/text()'
      Details:
        selector: '//div[@class="block-more"]/div[@class="row"]/span[@class="desc"]/text()'
      Date:
        selector: '//div[@class="block-player"]//meta[@itemprop="uploadDate"]/@content'
        postProcess:
          - replace:
              - regex: '(\d{4}-\d{2}-\d{2})T.*'
                with: $1
          - parseDate: 2006-01-02
      Image: '//meta[@property="og:image"]/@content'
      URL: '//meta[@property="og:url"]/@content'
      Studio:
        Name:
          selector: '//div[@class="heading"]/h1/text()'
          postProcess:
            - replace:
                # This regex matches the entire string and replaces it with your static value
                - regex: '.*'
                  with: "TubeVideos"
      Performers:
        Name:
          selector: '//div[@class="video-info"]//a[@class="member"]/text()'
