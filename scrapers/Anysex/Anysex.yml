name: Anysex

sceneByName:
  action: scrapeXPath
  queryURL: https://anysex.com/search/?q={}&sort_by=relevance
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - anysex.com
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: https://anysex.com/video/{filename}/
  queryURLReplace:
    filename:
      - regex: '.*\[(\d+)\].*'
        with: $1
      - regex: '^.*?(\d+)\..+$'
        with: $1
      - regex: .*\.[^\.]+$
        with:

xPathScrapers:
  sceneSearch:
    common:
      $videoCard: '//div[contains(@class, "item")]'
    scene:
      Title: 
        selector: '$videoCard//strong[@class="title"]/text()'
      URL: 
        selector: '$videoCard//a[contains(@class, "popfire")]/@href'
      Image: 
        selector: '$videoCard//img/@src'

  sceneScraper:
    scene:
      # Updated Title selector to check meta tags and common H1 locations
      Title: 
        selector: '//div[@class="page-title"]/h1/text()'
        postProcess:
          - replace:
              # Clean up " - Anysex.com" if it's scraped from the meta title
              - regex: '(?i)\s*-\s*Anysex\.com.*'
                with: ""
      Details: '//div[@class="block-details"]//div[@class="info"]/div[@class="item"]/text()'
      Date:
        selector: '//script[@type="application/ld+json" and contains(., "uploadDate")]/text()'
        postProcess:
          - replace:
              - regex: '.*"uploadDate":\s*"([^"]+)".*'
                with: $1
              - regex: '(\d{4}-\d{2}-\d{2})T.*'
                with: $1
          - parseDate: 2006-01-02
      Image: '//meta[@property="og:image"]/@content'
      URL: '//meta[@property="og:url"]/@content'
      Studio:
        Name:
          # Target the title tag as a reliable anchor
          selector: //title/text()
          postProcess:
            - replace:
                # This regex matches the entire string and replaces it with your static value
                - regex: '.*'
                  with: "TubeVideos"
      Tags:
        Name: '//div[@class="item-tags-holder"]//a[contains(@href, "/categories/")]/text()'
      Performers:
        Name: '//div[contains(@class, "item-model")]/a/text()'
