name: Anysex

sceneByName:
  action: scrapeXPath
  queryURL: https://anysex.com/search/?q={}
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - anysex.com
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: https://anysex.com/video/{filename}/
  queryURLReplace:
    filename:
      - regex: '.*\[(\d+)\].*'
        with: $1
      - regex: '^.*?(\d+)\..+$'
        with: $1
      - regex: .*\.[^\.]+$
        with:

xPathScrapers:
  sceneSearch:
    common:
      $videoCard: '//div[contains(@class,"item") and @data-video-id]'
    scene:
      Title:
        selector: '$videoCard//strong[@class="title"]/text()'
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      URL:
        selector: '$videoCard//a[contains(@class,"popfire")]/@href'
      Image:
        selector: '$videoCard//img/@src'

  sceneScraper:
    scene:
      Title:
        selector: '(//div[@class="page-title"]/h1)[1]/text()'
      Details:
        selector: '(//div[@class="block-details"]//div[@class="info"]/div[@class="item"])[1]/text()'
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Tags:
        Name:
          selector: '//div[contains(@class,"video-tags")]//div[contains(@class,"swiper-slide") and not(contains(@class,"item-cs")) and not(contains(@class,"item-model"))]/a/text()'
      Performers:
        Name:
          selector: '//div[contains(@class,"video-tags")]//div[contains(@class,"item-model")]/a/text()'
      Date:
        selector: '//script[@type="application/ld+json" and contains(.,"uploadDate")]/text()'
        postProcess:
          - replace:
              - regex: '.*"uploadDate":\s*"([^"]+)".*'
                with: $1
              - regex: '(\d{4}-\d{2}-\d{2})T.*'
                with: $1
          - parseDate: 2006-01-02
      URL:
        selector: '//link[@rel="alternate" and @hreflang="x-default"]/@href'
      Image:
        selector: '//meta[@property="og:image"]/@content'
      Studio:
        Name:
          fixed: "TubeVideos"

driver:
  useCDP: true
  sleep: 5
# Last Updated July 28, 2026
