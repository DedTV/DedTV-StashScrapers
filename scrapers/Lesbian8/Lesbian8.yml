name: Lesbian8

sceneByName:
  action: scrapeXPath
  queryURL: https://lesbian8.com/search/?q={}&sort_by=relevance
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - lesbian8.com
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: https://lesbian8.com/video/{filename}/
  queryURLReplace:
    filename:
      - regex: '.*\[(\d+)\].*'
        with: $1
      - regex: '^.*?(\d+)\..+$'
        with: $1
      - regex: .*\.[^\.]+$
        with:

xPathScrapers:
  sceneSearch:
    common:
      $videoCard: '//div[contains(@class, "item")]'
    scene:
      Title: 
        selector: '$videoCard//strong[@class="title"]/text()'
      URL: 
        selector: '$videoCard//a/@href'
      Image: 
        selector: '$videoCard//img/@src'

  sceneScraper:
    scene:
      # Updated Title selector to check meta tags and common H1 locations
      Title:
        selector: '//meta[@property="og:title"]/@content'      
      Details: '//div[@class="video-info-section"]//p[@class="description"]/text()'
      Date:
        selector: '//script[@type="application/ld+json" and contains(., "uploadDate")]/text()'
        postProcess:
          - replace:
              - regex: '.*"uploadDate":\s*"([^"]+)".*'
                with: $1
              - regex: '(\d{4}-\d{2}-\d{2})T.*'
                with: $1
          - parseDate: 2006-01-02
      Image: '//meta[@property="og:image"]/@content'
      URL: '//meta[@property="og:url"]/@content'
      Studio:
        Name:
          # Target the title tag as a reliable anchor
          selector: //title/text()
          postProcess:
            - replace:
                # This regex matches the entire string and replaces it with your static value
                - regex: '.*'
                  with: "TubeVideos"
      Tags: 
        Name:
          selector: '//meta[@name="keywords"]/@content'
          split: ", "
      Performers:
        Name: '//div[@class="item-models-holder"]//a/text()'
        
driver:
  useCDP: true
        
